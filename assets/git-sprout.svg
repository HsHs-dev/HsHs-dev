<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44" role="img" aria-label="Animated Git commit branching">
<title>Git branching</title>
<style>
.flow{stroke-dasharray:5 6;animation:trace 5s linear infinite;}
.a{animation:commit 3s ease-in-out infinite;}
.b{animation:commit 3s ease-in-out -1s infinite;}
.c{animation:commit 3s ease-in-out -2s infinite;}
@keyframes trace{to{stroke-dashoffset:-44}}
@keyframes commit{0%,100%{opacity:.7}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.flow,.a,.b,.c{animation:none!important}}
</style>
<rect x="2" y="2" width="40" height="40" rx="11" fill="#172535" stroke="#36536C" stroke-width="1.3"/>
<path d="M13 9V30q0 5 7 5h12M13 17q0 6 9 6h3q7 0 7-7v-3" fill="none" stroke="#35455F" stroke-width="3" stroke-linecap="round"/>
<path class="flow" d="M13 9V30q0 5 7 5h12M13 17q0 6 9 6h3q7 0 7-7v-3" fill="none" stroke="#79B8FF" stroke-width="2.1" stroke-linecap="round"/>
<circle class="a" cx="13" cy="10" r="4" fill="#79DDEB"/>
<circle class="b" cx="13" cy="30" r="4" fill="#F2BB71"/>
<circle class="c" cx="32" cy="13" r="4" fill="#C4B5FD"/>
<circle class="a" cx="32" cy="35" r="4" fill="#9BDD98"/>
</svg>
