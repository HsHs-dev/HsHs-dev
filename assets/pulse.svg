<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44" role="img" aria-label="Animated activity signal">
<title>Activity pulse</title>
<style>
.signal{stroke-dasharray:75;stroke-dashoffset:75;animation:draw 4.8s ease-in-out infinite;}
.led{animation:blink 4.8s ease-in-out infinite;}
@keyframes draw{0%{stroke-dashoffset:75;opacity:.2}45%,80%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-75;opacity:.35}}
@keyframes blink{0%,35%,100%{opacity:.3}55%,72%{opacity:1}}
@media(prefers-reduced-motion:reduce){.signal,.led{animation:none!important;stroke-dashoffset:0;opacity:1}}
</style>
<rect x="2" y="2" width="40" height="40" rx="11" fill="#172535" stroke="#36536C" stroke-width="1.3"/>
<path d="M6 25h8l4-12 7 20 4-10h9" stroke="#364759" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path class="signal" d="M6 25h8l4-12 7 20 4-10h9" stroke="#9BDD98" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="led" cx="38" cy="23" r="2.5" fill="#F2BB71"/>
</svg>
