<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44" role="img" aria-label="Slowly orbiting colorful particles">
<title>Technology orbit</title>
<style>
.o1,.o2 {transform-origin:22px 22px;transform-box:view-box;}
.o1 {animation: spin 9s linear infinite;}
.o2 {animation: reverse 12s linear infinite;}
.nucleus{animation:glow 3.5s ease-in-out infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes reverse{to{transform:rotate(-360deg)}}
@keyframes glow{0%,100%{opacity:.72}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.o1,.o2,.nucleus{animation:none!important}}
</style>
<rect x="2" y="2" width="40" height="40" rx="11" fill="#172535" stroke="#36536C" stroke-width="1.3"/>
<g class="o1"><ellipse cx="22" cy="22" rx="17" ry="7.4" transform="rotate(-33 22 22)" fill="none" stroke="#79DDEB" stroke-width="1.4"/><circle cx="35.6" cy="11.7" r="3.1" fill="#F2BB71"/></g>
<g class="o2"><ellipse cx="22" cy="22" rx="17" ry="7.4" transform="rotate(55 22 22)" fill="none" stroke="#C4B5FD" stroke-width="1.4"/><circle cx="13" cy="7.6" r="2.6" fill="#79DDEB"/></g>
<circle class="nucleus" cx="22" cy="22" r="5" fill="#9BDD98"/>
</svg>
