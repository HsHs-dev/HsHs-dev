# File: .github/workflows/profile-cards.yml
# Generates theme-aware GitHub statistics images directly into your profile repository.
# Source: https://github.com/seijikohara/profile-cards-action
name: Refresh profile cards

on:
  schedule:
    - cron: "17 3 * * *" # Daily, 03:17 UTC; schedules can be delayed by GitHub
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate profile cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: HsHs-dev
          cards: overview,contributions
          output-dir: assets
          themes: light,dark
          palette: blue
          commit: true
