# Reuses the existing profile-cards generator, then renders the workbench.
# One workflow and one commit prevents competing scheduled writes.
name: Refresh profile cards and workbench

on:
  schedule:
    - cron: "17 3 * * *" # Daily at 03:17 UTC (GitHub may delay schedules)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate the existing statistics cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: HsHs-dev
          cards: overview,contributions
          output-dir: assets
          themes: light,dark
          palette: blue
          commit: false

      - name: Generate the small data-driven workbench card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/render_workbench.py

      - name: Commit and push updated SVGs together
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/overview.*.svg assets/contributions.*.svg assets/workbench.*.svg
          if [ -f data/last_public_push.json ]; then git add data/last_public_push.json; fi
          if git diff --cached --quiet; then
            echo "Nothing to update"
            exit 0
          fi
          git commit -m "chore(profile): refresh cards and workbench [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
